[package]
name = "feeding-tube"
version = "2.1.0"
edition = "2021"
authors = ["Jens Bech-Sørensen"]
description = "A terminal UI for managing YouTube subscriptions and watching videos"

[[bin]]
name = "feeding-tube"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dirs = "5"
open = "5"
clap = { version = "4", features = ["derive"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.2"
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }

[features]
default = []
web = ["axum", "tower-http", "tokio-util"]

[profile.release]
opt-level = 3
lto = true
strip = true
